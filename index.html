<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SERTAO: acervo de amostras de fala emocional em português brasileiro, organizado em sete classes para escuta e inspeção qualitativa."
    />
    <meta name="color-scheme" content="light dark" />
    <title>SERTAO — Corpus de fala emocional</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Applies the saved theme before first paint to avoid a flash. Light is the default. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var stored = window.localStorage.getItem('sertao-theme');
          if (stored === 'light' || stored === 'dark' || stored === 'sertao') theme = stored;
        } catch (error) {
          /* storage unavailable: keep the default */
        }
        document.documentElement.classList.add('theme-' + theme);
        document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
        var language = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
        try {
          var savedLanguage = window.localStorage.getItem('sertao-language');
          if (savedLanguage === 'pt' || savedLanguage === 'en') language = savedLanguage;
        } catch (error) {
          /* storage unavailable: use browser language */
        }
        document.documentElement.lang = language.toLowerCase().startsWith('pt') ? 'pt-BR' : 'en';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
