name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run the deploy by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` runs scripts/build-samples.mjs first, which copies the
      # WAVs out of ./sertao into public/audio and regenerates samples.json.
      # SITE_BASE must match the repository name so every relative asset URL
      # resolves under https://<user>.github.io/SERTAO/.
      - name: Build
        run: npm run build
        env:
          SITE_BASE: /SERTAO/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
